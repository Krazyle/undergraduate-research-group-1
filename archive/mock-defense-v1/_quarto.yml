project:
  type: default
  render:
    - slides.qmd

bibliography: ../bibliography.bib
csl: ../apa.csl

format:
  revealjs:
    theme: [default, theme.scss]
    width: 1280
    height: 720
    margin: 0.06
    embed-resources: true
    slide-number: c/t
    show-slide-number: all
    transition: none
    controls: false
    progress: false
    hash: true
    fragment-in-url: true
    menu: false
    include-in-header: fonts.html
